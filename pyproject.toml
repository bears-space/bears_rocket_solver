[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name    = "bears_rocket_solver"
version = "2026.11.05"
license = "GPL-3.0-or-later"
readme  = "README.md"
dependencies = [
	"openmdao",
	"cea",
	"rocketcea",
	"coolprop",
	"isacalc",
]
authors = [
	{ name = "Andrii Kozytskyi", email = "kozytskyi.andrii.d@gmail.com" }
]

[project.optional-dependencies]
verification = [
	"mypy",
	"pydot",
	"graphviz",
	"scipy-stubs",
]

[tool.setuptools.packages.find]
where   = ["."]
include = ["modules*"]

[tool.distutils.egg_info]
egg_base = "build"

[tool.mypy]
check_untyped_defs   = true
warn_unused_ignores  = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
	"openmdao.*",
	"cea",
	"rocketcea.*",
	"CoolProp.*",
	"isacalc",
]
ignore_missing_imports = true

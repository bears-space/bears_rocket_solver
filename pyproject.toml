[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "bears_rocket_solver"
version = "2026.11.05"
license = "GPL-3.0-or-later"
readme = "README.md"
dependencies = [
	"cea",
	"openmdao",
	"isacalc",
	"rocketpy"
]
authors = [
	{ name = "Andrii Kozytskyi", email = "kozytskyi.andrii.d@gmail.com" }
]

[project.optional-dependencies]
verification = [
	"mypy",
	"pydot",
	"graphviz",
	"scipy-stubs"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*"]

[tool.distutils.egg_info]
egg_base = "build"

[tool.mypy]
mypy_path = ["./stubs"]

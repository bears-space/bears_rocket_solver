# Acceptance limits for the optimized rocket, checked after every run
#
# Errors ("Fail") stop the run, warnings ("Warn") are printed. Design inputs
# live in rocket_inputs.toml. Every key is required
#
# TODO rework checks to physical checks and EUROC envelope

# Warn below this injector pressure drop over chamber pressure [-]
min_injector_pressure_drop_ratio = 0.15

# Fail below this liftoff thrust-to-weight ratio [-]
min_liftoff_twr                  = 1.0

# Warn below this liftoff thrust-to-weight ratio [-]
low_liftoff_twr                  = 1.3

# Warn below/above delivered Isp [s]
min_isp_s                        = 150.0
max_isp_s                        = 350.0

# Warn below/above chamber temperature [K]
min_flame_temperature_k          = 1500.0
max_flame_temperature_k          = 4000.0

# Fail when the apogee misses its target by more [m]
apogee_tolerance_m               = 20.0

# Fail when thrust or chamber pressure misses its target by more, relative [-]
target_tolerance                 = 0.01

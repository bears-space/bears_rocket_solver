# Material properties
#
# Every material, fluid and reactant property used by the solver is defined
# here and nowhere else in the code. Physical constants live in constants.toml,
# design inputs in rocket_inputs.toml
#
# Values are in SI units unless a key or a *_units entry says otherwise. Every
# key is required unless its comment says it is optional

[air]
# Dry air, treated as a calorically perfect ideal gas
molar_mass = 0.0289644 # Molar mass [kg/mol]
gamma      = 1.4       # Ratio of specific heats cp / cv [-]

# Structural materials. Keys of each entry:
#   id                 Name the wall layers below refer to
#   name               Display name
#   density            Density, in density_units ("kg/m^3" or "g/cm^3")
#   yield_strength     Yield strength, in strength_units ("Pa" or "MPa")
#   ultimate_strength  Stress at failure, in strength_units

[[material]]
id                = "AL_6061_T6"
name              = "Aluminum 6061-T6"
density           = 2700.0
density_units     = "kg/m^3"
yield_strength    = 276.0
ultimate_strength = 310.0
strength_units    = "MPa"

[[material]]
id                = "CFRP_T700"
name              = "T700 Carbon Fiber / Epoxy"
density           = 1550.0
density_units     = "kg/m^3"
yield_strength    = 1800.0
ultimate_strength = 2100.0
strength_units    = "MPa"

# Tank wall layups, layers from the inside out. Keys of each layer:
#   material           Material id from above
#   thickness_m        Fixed thickness [m]. Optional: one layer per wall may
#                      leave it out to be sized to the tank pressure
#   helical_angle_deg  Composite: helical fiber angle to tank axis [deg]
#   efficiency         Composite: realized share of fiber strength [-]
#   fiber_volume_frac  Composite: fiber share of the layer volume [-]
# A layer with a helical_angle_deg is a composite, one without is a metal

[[wall]]
id = "copv_press" # Wall id the rocket inputs refer to

  [[wall.layers]]
  material    = "AL_6061_T6"
  thickness_m = 0.001

  [[wall.layers]]
  material          = "CFRP_T700"
  helical_angle_deg = 20.0
  efficiency        = 0.85
  fiber_volume_frac = 0.72

[[wall]]
id = "copv_ox" # Wall id the rocket inputs refer to

  [[wall.layers]]
  material    = "AL_6061_T6"
  thickness_m = 0.001

  [[wall.layers]]
  material          = "CFRP_T700"
  helical_angle_deg = 20.0
  efficiency        = 0.85
  fiber_volume_frac = 0.72

# Pressurant gases. Keys of each entry:
#   id             Name the rocket inputs refer to
#   name           Display name
#   coolprop_name  Fluid name in CoolProp, for the real-gas model
#   molar_mass     Molar mass [kg/mol]
#   gamma          Ratio of specific heats cp / cv [-]
#   z_factor       Full-bottle compressibility factor (ideal gas) [-]

[[gas]]
id            = "N2"
name          = "Nitrogen Gas"
coolprop_name = "N2"
molar_mass    = 0.0280134
gamma         = 1.40
z_factor      = 1.15

[[gas]]
id            = "He"
name          = "Helium Gas"
coolprop_name = "He"
molar_mass    = 0.0040026
gamma         = 1.667
z_factor      = 1.05

# Propellant reactants: [[fuel]] entries blend into the fuel grain, exactly one
# [[oxid]] is the liquid oxidizer. Keys of each entry:
#   name                CEA species name, or a new name for a custom species
#   mass_fraction       Relative mass share within the same role [-]
#   formula_parts       List of atom-count dicts summed into a formula
#   temperature_k       Temperature at injection [K]
#   enthalpy            Enthalpy of formation ("j/mol" or "kj/mol");
#                       Optional: omit with enthalpy_units to use CEA library
#   density             Density, in density_units ("kg/m^3" or "g/cm^3")
#   vapor_pressure_bar  Oxidizer: saturation pressure [bar]

[[fuel]]
name           = "Paraffin"
mass_fraction  = 5.0
formula_parts  = [{ C = 25, H = 52 }]
temperature_k  = 298.15
enthalpy       = -1438.2
enthalpy_units = "kj/mol"
density        = 0.9
density_units  = "g/cm^3"

[[fuel]]
name           = "ABS"
mass_fraction  = 1.0
formula_parts  = [
	{ C = 8, H = 8 },
	{ C = 4, H = 6 },
	{ C = 3, H = 3, N = 1 }
]
temperature_k  = 298.15
enthalpy       = 66.9
enthalpy_units = "kj/mol"
density        = 1.05
density_units  = "g/cm^3"

[[oxid]]
name               = "N2O"
mass_fraction      = 1.0
formula_parts      = [{ N = 2, O = 1 }]
temperature_k      = 298.15
density            = 0.6881
density_units      = "g/cm^3"
# Saturation pressure at 30 degC (pressurizer_tank ambient_temp_c) [bar]
vapor_pressure_bar = 63.08
